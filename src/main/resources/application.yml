# Spring Boot Application Configuration
spring:
  application:
    name: seckill-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zhongyi?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  sql:
    init:
      schema-locations: classpath:schema.sql,classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      mode: always
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  task:
    execution:
      pool:
        core-size: 10
        max-size: 100
        queue-capacity: 500
        keep-alive: 60s

# MyBatis Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:mapper/xml/**/*.xml
  type-aliases-package: com.example.myspringboot.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  # 自动表生成配置
#  schema: classpath*:db/schema.sql
#  data: classpath*:db/data.sql

server:
  port: 8082
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    min-spare-threads: 20

logging:
  level:
    root: INFO
    com.example.myspringboot: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/seckill-system.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 100MB
    clean-history-on-start: false

# Seckill System Configuration
seckill:
  order:
    timeout: 30
  stock:
    retry.count: 3
  request:
    limit: 1000
  path:
    expire.seconds: 60